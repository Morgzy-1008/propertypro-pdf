[package]
name = "hudson-homes-os"
version = "2026.1.0"
description = "Hudson Homes Digital Builder OS — Native Windows Desktop Application"
authors = ["Hudson Homes Australia"]
license = "Proprietary"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "hudson_homes_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = "2.10"
